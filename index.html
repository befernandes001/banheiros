<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f7f5">
  <title>Encontrar banheiro</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7f5;
      --ink: #17241f;
      --muted: #5c6f68;
      --line: #d5e3dc;
      --card: #fff;
      --field: #f7faf8;
      --accent: #146b56;
      --accent-ink: #fff;
      --accent-soft: #e5f3ed;
      --warn: #8a3b12;
      --warn-bg: #fff4ec;
      --shadow: 0 8px 24px rgba(23, 36, 31, 0.08);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.45;
      color: var(--ink);
      background: var(--bg);
      min-height: 100vh;
      min-height: 100dvh;
    }
    .app {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
    }
    header {
      flex: none;
      background: var(--card);
      padding: 14px 16px 12px;
      box-shadow: 0 1px 0 var(--line);
      z-index: 2;
    }
    .appbar {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .selo { flex: none; display: block; }
    .marca-texto { flex: 1; min-width: 0; }
    h1 {
      font-size: 1.25rem;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 1px 0 4px;
    }
    #status {
      margin: 0;
      min-height: 1.35em;
      font-size: 0.95rem;
      color: var(--muted);
    }
    #status.erro {
      color: var(--warn);
      background: var(--warn-bg);
      padding: 8px 10px;
      border-radius: 10px;
    }
    #de-novo {
      flex: none;
      margin-top: 1px;
      min-height: 40px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--accent);
      font: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }
    .tools {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    input, button { font: inherit; }
    input {
      flex: 1;
      min-width: 0;
      min-height: 48px;
      border-radius: 999px;
      border: 1px solid var(--line);
      padding: 10px 16px;
      background: var(--field);
      color: var(--ink);
    }
    input::placeholder { color: #7d8e87; }
    button[type="submit"] {
      flex: none;
      min-height: 48px;
      padding: 0 18px;
      border: 0;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-ink);
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: 0.55; cursor: wait; }
    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    #escolhas:not([hidden]) {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px 16px 10px;
      max-height: 28vh;
      overflow: auto;
      background: var(--card);
      border-bottom: 1px solid var(--line);
    }
    #escolhas button {
      text-align: left;
      background: var(--field);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 12px;
      min-height: 44px;
      line-height: 1.35;
      cursor: pointer;
    }
    .layout {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    #map {
      flex: 1 1 0;
      min-height: 160px;
      background: #d5e2db;
    }
    .lado {
      flex: 0 1 auto;
      max-height: min(46dvh, 420px);
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
      border-top: 1px solid var(--line);
      box-shadow: 0 -10px 28px rgba(23, 36, 31, 0.06);
      z-index: 2;
    }
    .lado-scroll {
      overflow: auto;
      min-height: 0;
      overscroll-behavior: contain;
    }
    .lista-titulo {
      margin: 0;
      padding: 12px 16px 0;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .lado:has(#lista:empty) .lista-titulo { display: none; }
    #vazio:not([hidden]) {
      margin: 0;
      padding: 22px 16px;
      text-align: center;
      color: var(--muted);
    }
    #lista {
      list-style: none;
      margin: 0;
      padding: 10px 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #lista li button {
      width: 100%;
      text-align: left;
      background: var(--card);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 4px;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(23, 36, 31, 0.04);
    }
    #lista li button.ativo {
      border-color: #9dcebf;
      background: #f3faf7;
      box-shadow: inset 3px 0 0 var(--accent);
    }
    .topo {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    #lista .nome {
      font-weight: 700;
      line-height: 1.3;
      min-width: 0;
    }
    #lista .dist {
      flex: none;
      margin-top: 1px;
      font-size: 0.85rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 3px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }
    #lista .detalhe {
      color: var(--muted);
      font-size: 0.9rem;
    }
    footer {
      flex: none;
      margin: 0;
      padding: 4px 16px calc(12px + env(safe-area-inset-bottom));
      font-size: 0.72rem;
      line-height: 1.35;
      color: var(--muted);
    }
    .leaflet-container { font: inherit; }
    .leaflet-bar {
      border: 0 !important;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .leaflet-bar a { width: 34px; height: 34px; line-height: 34px; }
    .leaflet-popup-content-wrapper {
      border-radius: 14px;
      box-shadow: var(--shadow);
    }
    .leaflet-popup-content { margin: 12px 14px; line-height: 1.4; }
    .leaflet-popup-content a { color: var(--accent); }
    @media (hover: hover) {
      button[type="submit"]:hover { background: #0f5a48; }
      #de-novo:hover, #escolhas button:hover { background: var(--accent-soft); }
      #lista li button:hover { border-color: #b7cdc4; }
    }
    @media (max-width: 420px) {
      h1 { font-size: 1.12rem; }
      #de-novo { padding: 8px 10px; font-size: 0.82rem; }
    }
    @media (min-width: 840px) {
      header { padding: 16px 20px 14px; }
      h1 { font-size: 1.45rem; }
      .tools { max-width: 640px; }
      .layout { flex-direction: row; }
      #map { min-height: 0; height: auto; }
      .lado {
        width: min(420px, 40vw);
        max-height: none;
        flex: none;
        align-self: stretch;
        border-top: 0;
        border-left: 1px solid var(--line);
        box-shadow: none;
      }
      .lado-scroll { flex: 1; }
      #lista { padding: 12px 14px 16px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="appbar">
        <svg class="selo" viewBox="0 0 32 32" width="36" height="36" aria-hidden="true">
          <rect width="32" height="32" rx="11" fill="#e5f3ed"/>
          <path fill="#146b56" d="M16 6.2a6.4 6.4 0 0 0-6.4 6.4c0 4.7 6.4 11.2 6.4 11.2s6.4-6.5 6.4-11.2A6.4 6.4 0 0 0 16 6.2zm0 8.6a2.2 2.2 0 1 1 0-4.4 2.2 2.2 0 0 1 0 4.4z"/>
        </svg>
        <div class="marca-texto">
          <h1>Encontrar banheiro</h1>
          <p id="status">Pedindo sua localização…</p>
        </div>
        <button type="button" class="secundario" id="de-novo">Buscar de novo</button>
      </div>
      <form class="tools" id="form-endereco">
        <input id="endereco" type="search" enterkeyhint="search" placeholder="Cidade ou endereço" autocomplete="off" aria-label="Cidade ou endereço">
        <button type="submit">Buscar</button>
      </form>
    </header>
    <div id="escolhas" hidden></div>
    <div class="layout">
      <div id="map" role="region" aria-label="Mapa"></div>
      <div class="lado">
        <div class="lado-scroll">
          <p class="lista-titulo">Mais próximos</p>
          <p id="vazio">Os banheiros aparecem aqui.</p>
          <ul id="lista"></ul>
        </div>
        <footer>© OpenStreetMap contributors. Endereços via Nominatim. Banheiros via Overpass. A cobertura no Brasil é incompleta.</footer>
      </div>
    </div>
  </div>
  <noscript><p>Ative o JavaScript para buscar banheiros.</p></noscript>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const statusEl = document.getElementById("status");
    const listaEl = document.getElementById("lista");
    const vazioEl = document.getElementById("vazio");
    const escolhasEl = document.getElementById("escolhas");
    const btnDeNovo = document.getElementById("de-novo");
    const form = document.getElementById("form-endereco");
    const inputEndereco = document.getElementById("endereco");

    const RAIO_PERTO = 2000;
    const RAIO_LONGE = 5000;
    const POUCOS = 3;

    let mapa = null;
    let camadaBanheiros = null;
    let marcaUsuario = null;
    let circulo = null;
    let ponto = null;
    let buscaId = 0;
    let geoToken = 0;
    let ocupado = false;

    function texto(msg, erro) {
      statusEl.textContent = msg;
      statusEl.classList.toggle("erro", !!erro);
    }

    function metros(m) {
      return Math.round(m).toLocaleString("pt-BR") + " m";
    }

    function distancia(aLat, aLon, bLat, bLon) {
      const R = 6371000;
      const r = Math.PI / 180;
      const dLat = (bLat - aLat) * r;
      const dLon = (bLon - aLon) * r;
      const s = Math.sin(dLat / 2) ** 2 +
        Math.cos(aLat * r) * Math.cos(bLat * r) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.asin(Math.min(1, Math.sqrt(s)));
    }

    function cadeira(tags) {
      if (!tags || tags.wheelchair == null || tags.wheelchair === "") return "";
      const mapaTxt = { yes: "sim", no: "não", limited: "limitado", designated: "sim" };
      const valor = mapaTxt[tags.wheelchair] || tags.wheelchair;
      return "Cadeira de rodas: " + valor;
    }

    function nomeDo(tags) {
      if (!tags) return "Banheiro sem nome";
      return tags.name || tags["name:pt"] || "Banheiro sem nome";
    }

    function coordenadas(el) {
      if (typeof el.lat === "number" && typeof el.lon === "number") return [el.lat, el.lon];
      if (el.center && typeof el.center.lat === "number") return [el.center.lat, el.center.lon];
      return null;
    }

    function garantirMapa(lat, lon) {
      if (!window.L) {
        texto("O mapa não carregou. Verifique a internet e abra de novo.", true);
        return false;
      }
      if (!mapa) {
        mapa = L.map("map", { zoomControl: true });
        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
          attribution: "© OpenStreetMap contributors"
        }).addTo(mapa);
        camadaBanheiros = L.layerGroup().addTo(mapa);
      }
      mapa.setView([lat, lon], 15);
      return true;
    }

    function marcarUsuario(lat, lon, raio) {
      if (marcaUsuario) mapa.removeLayer(marcaUsuario);
      if (circulo) mapa.removeLayer(circulo);
      marcaUsuario = L.circleMarker([lat, lon], {
        radius: 8,
        color: "#0b3d91",
        fillColor: "#3b82f6",
        fillOpacity: 0.95,
        weight: 2
      }).addTo(mapa).bindPopup("Você está aqui");
      circulo = L.circle([lat, lon], {
        radius: raio,
        color: "#0f6e56",
        weight: 1,
        fillOpacity: 0.05
      }).addTo(mapa);
    }

    function consultaOverpass(lat, lon, raio) {
      const la = Number(lat).toFixed(6);
      const lo = Number(lon).toFixed(6);
      const q = '[out:json][timeout:25];(node["amenity"="toilets"](around:' + raio + "," + la + "," + lo +
        ');way["amenity"="toilets"](around:' + raio + "," + la + "," + lo +
        ');relation["amenity"="toilets"](around:' + raio + "," + la + "," + lo +
        "););out center;";
      const url = "https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(q);
      const ctrl = new AbortController();
      const timer = setTimeout(function () { ctrl.abort(); }, 30000);
      return fetch(url, { signal: ctrl.signal }).then(function (res) {
        if (!res.ok) throw new Error("http " + res.status);
        return res.json();
      }).finally(function () { clearTimeout(timer); });
    }

    function lugaresDe(json, lat, lon) {
      const vistos = Object.create(null);
      const lista = [];
      const elementos = (json && json.elements) || [];
      elementos.forEach(function (el) {
        const c = coordenadas(el);
        if (!c) return;
        const chave = el.type + "/" + el.id;
        if (vistos[chave]) return;
        vistos[chave] = true;
        const tags = el.tags || {};
        lista.push({
          id: chave,
          lat: c[0],
          lon: c[1],
          nome: nomeDo(tags),
          cadeira: cadeira(tags),
          dist: distancia(lat, lon, c[0], c[1])
        });
      });
      lista.sort(function (a, b) { return a.dist - b.dist; });
      return lista;
    }

    function ajustarMapa() {
      if (!mapa) return;
      requestAnimationFrame(function () { mapa.invalidateSize(); });
    }

    function desenhar(lugares, lat, lon) {
      camadaBanheiros.clearLayers();
      listaEl.innerHTML = "";
      vazioEl.hidden = lugares.length > 0;
      if (!lugares.length) {
        vazioEl.textContent = "Nenhum banheiro nesta busca.";
        ajustarMapa();
        return;
      }
      lugares.forEach(function (p) {
        const extra = p.cadeira ? "<br>" + p.cadeira : "";
        const rota = "https://www.openstreetmap.org/directions?engine=fossgis_osrm_foot&route=" +
          encodeURIComponent(lat + "," + lon + ";" + p.lat + "," + p.lon);
        const popup = "<strong>" + escapar(p.nome) + "</strong><br>" + metros(p.dist) + extra +
          '<br><a href="' + rota + '" target="_blank" rel="noopener">Como chegar</a>';
        const marker = L.marker([p.lat, p.lon]).addTo(camadaBanheiros);
        marker.bindPopup(popup);
        p.marker = marker;

        const li = document.createElement("li");
        const b = document.createElement("button");
        b.type = "button";
        const topo = document.createElement("span");
        topo.className = "topo";
        const nome = document.createElement("span");
        nome.className = "nome";
        nome.textContent = p.nome;
        const dist = document.createElement("span");
        dist.className = "dist";
        dist.textContent = metros(p.dist);
        topo.appendChild(nome);
        topo.appendChild(dist);
        b.appendChild(topo);
        if (p.cadeira) {
          const det = document.createElement("span");
          det.className = "detalhe";
          det.textContent = p.cadeira;
          b.appendChild(det);
        }
        b.addEventListener("click", function () {
          document.querySelectorAll("#lista button").forEach(function (el) { el.classList.remove("ativo"); });
          b.classList.add("ativo");
          mapa.setView([p.lat, p.lon], 18);
          marker.openPopup();
        });
        li.appendChild(b);
        listaEl.appendChild(li);
      });
      ajustarMapa();
    }

    function escapar(s) {
      return String(s).replace(/[&<>"']/g, function (c) {
        return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
      });
    }

    function setOcupado(v) {
      ocupado = v;
      btnDeNovo.disabled = v;
      form.querySelector("button[type=submit]").disabled = v;
    }

    function buscarBanheiros(lat, lon) {
      if (!garantirMapa(lat, lon)) return;
      ponto = { lat: lat, lon: lon };
      const id = ++buscaId;
      setOcupado(true);
      texto("Buscando banheiros num raio de 2 km…");
      consultaOverpass(lat, lon, RAIO_PERTO).then(function (json) {
        if (id !== buscaId) return;
        let lugares = lugaresDe(json, lat, lon);
        let raio = RAIO_PERTO;
        if (lugares.length >= POUCOS) return { lugares: lugares, raio: raio };
        texto(lugares.length ? "Poucos resultados. Buscando num raio de 5 km…" : "Nada em 2 km. Buscando num raio de 5 km…");
        return consultaOverpass(lat, lon, RAIO_LONGE).then(function (json2) {
          return { lugares: lugaresDe(json2, lat, lon), raio: RAIO_LONGE, aviso: json2 && json2.remark };
        }).catch(function () {
          return { lugares: lugares, raio: RAIO_PERTO, falhaAmpla: true };
        });
      }).then(function (res) {
        if (!res || id !== buscaId) return;
        marcarUsuario(lat, lon, res.raio);
        desenhar(res.lugares, lat, lon);
        mapa.setView([lat, lon], res.raio > RAIO_PERTO ? 13 : 15);
        ajustarMapa();
        const km = res.raio / 1000;
        if (!res.lugares.length) {
          texto("Nenhum banheiro público num raio de " + km + " km. O OpenStreetMap pode não ter banheiros nesta área.", true);
        } else if (res.falhaAmpla) {
          const n2 = res.lugares.length;
          texto(n2 + (n2 === 1 ? " banheiro em 2 km. A busca de 5 km falhou." : " banheiros em 2 km. A busca de 5 km falhou."));
        } else {
          const n = res.lugares.length;
          texto(n + (n === 1 ? " banheiro" : " banheiros") + " num raio de " + km + " km.");
        }
      }).catch(function () {
        if (id !== buscaId) return;
        texto("Não consegui consultar os banheiros. Tente de novo em alguns segundos.", true);
        vazioEl.hidden = false;
        vazioEl.textContent = "A consulta falhou. Toque em Buscar de novo.";
      }).finally(function () {
        if (id === buscaId) setOcupado(false);
      });
    }

    function usarPonto(lat, lon, rotulo) {
      escolhasEl.hidden = true;
      escolhasEl.innerHTML = "";
      if (rotulo) texto("Lugar: " + rotulo);
      buscarBanheiros(lat, lon);
    }

    function buscarEndereco(q) {
      geoToken += 1;
      const id = ++buscaId;
      setOcupado(true);
      texto("Buscando o endereço…");
      const url = "https://nominatim.openstreetmap.org/search?format=json&limit=5&accept-language=pt-BR&q=" + encodeURIComponent(q);
      fetch(url).then(function (res) {
        if (!res.ok) throw new Error("http");
        return res.json();
      }).then(function (arr) {
        if (id !== buscaId) return;
        setOcupado(false);
        if (!arr || !arr.length) {
          texto("Não achei esse lugar. Tente o nome da cidade.", true);
          return;
        }
        if (arr.length === 1) {
          usarPonto(parseFloat(arr[0].lat), parseFloat(arr[0].lon), arr[0].display_name);
          return;
        }
        texto("Toque no lugar certo.");
        escolhasEl.hidden = false;
        ajustarMapa();
        escolhasEl.innerHTML = "";
        arr.forEach(function (item) {
          const b = document.createElement("button");
          b.type = "button";
          b.textContent = item.display_name;
          b.addEventListener("click", function () {
            usarPonto(parseFloat(item.lat), parseFloat(item.lon), item.display_name);
          });
          escolhasEl.appendChild(b);
        });
      }).catch(function () {
        if (id !== buscaId) return;
        setOcupado(false);
        texto("A busca de endereço falhou. Tente de novo.", true);
      });
    }

    function pedirLocal() {
      if (!navigator.geolocation) {
        texto("Este navegador não informou a localização. Digite uma cidade ou endereço.", true);
        return;
      }
      const meu = ++geoToken;
      texto("Pedindo sua localização…");
      navigator.geolocation.getCurrentPosition(function (pos) {
        if (meu !== geoToken) return;
        usarPonto(pos.coords.latitude, pos.coords.longitude);
      }, function () {
        if (meu !== geoToken) return;
        texto("Sem localização. Digite uma cidade ou endereço.", true);
      }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 });
    }

    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      const q = inputEndereco.value.trim();
      if (!q) {
        texto("Digite uma cidade ou endereço.", true);
        return;
      }
      buscarEndereco(q);
    });

    btnDeNovo.addEventListener("click", function () {
      const centro = mapa ? mapa.getCenter() : null;
      if (centro && ponto) {
        buscarBanheiros(centro.lat, centro.lng);
        return;
      }
      if (ponto) {
        buscarBanheiros(ponto.lat, ponto.lon);
        return;
      }
      pedirLocal();
    });

    try {
      if (!window.L) {
        texto("O mapa não carregou. Verifique a internet e abra de novo.", true);
      } else {
        garantirMapa(-14.235, -51.9253);
        mapa.setZoom(4);
        pedirLocal();
      }
    } catch (e) {
